id: in-tennis
name: In Tennis
logo: https://dopeiyun.oss-cn-shenzhen.aliyuncs.com/attach/2024/11/a8cb6202411030906084426.png
desc: In Tennis 网球中心(CRMEB 场地预约系统)
backend:
  base: https://in.tennis168.vip
  storeId: 76
  orderType: 11
  payMethodWechat: weixin
  payMethodBalance: yue
# 已校准(2026-09-06): date_list 普通用户可见 7 天, 但下单校验"最大可预定范围"仅 3 天(会员可见 7 天, 可订范围未验证)
advanceDays:
  tennis: 3
release:
  timezone: Asia/Shanghai
  rules:
    tennis:
      mode: calendar-day-batch
      calendarDaysBefore: 3
      at: '00:00:00.000'
bookingHours:
  start: '07:00'
  end: '23:00'
  slotMinutes: 60
releaseRetry:
  unavailableGraceMs: 15000
  defaultMinIntervalMs: 2000
  maxAttempts: 6
courts:
  - name: 1号
    type: tennis
    uid: '119'
  - name: 2号
    type: tennis
    uid: '120'
  - name: 3号
    type: tennis
    uid: '121'
  - name: 4号
    type: tennis
    uid: '143'
credentialSchema:
  - key: Authori-zation
    label: 登录令牌
    desc: 从微信小程序抓包获取(Bearer JWT)；ready 检测即验证其有效性。
capture:
  enabled: true
  hosts:
    - in.tennis168.vip
  paths:
    - '*'
  headers:
    - Authori-zation
  tasks:
    - id: identity
      label: 身份凭证
      source: credential
      required: true
      maxAgeHours: 720
