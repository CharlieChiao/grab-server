id: wlh-dwq
name: 未来荟·大湾区文化体育中心
desc: 华润未来荟(crland), 4 片室内网球场, 微信支付
backend:
  base: https://wlhmobile.crland.com.cn
  projectUuid: 0ddda9c33d4e11f1b51c2273436a3e4e
  fieldAreaUuid: cec42d973dee11f1b51c2273436a3e4e   # 室内网球场地
# 放场: 每天 09:00 放出 2 天后(后天)的场次(提前 48 小时); 例: 周二的场次在周日 09:00 放出
# 可订/浏览 14 天: 抢订本就是提前排队, 后天与 14 天后无本质区别; 远期场次查询被场馆拒绝时前端显示为可选(未放场),
# fireAt 自动排到该场次放场日(目标日期-2 天)的 09:00
advanceDays:
  tennis: 14
bookableDays: 14
release:
  timezone: Asia/Shanghai
  rules:
    tennis:
      mode: calendar-day-batch
      calendarDaysBefore: 2
      at: '09:00:00.000'
bookingHours:
  start: '09:00'
  end: '21:00'
  slotMinutes: 60
# 下单请求不带金额(场馆按场次实际计价), 任务的"场次总价"可不填; 未声明的球场(如银豹)下单必须带金额
targetCostOptional: true
# 待支付窗口: 场馆约 6 分钟自动取消未付款订单(实测 09:00 下单 09:06:01 取消), 系统超时判定对齐该窗口
paymentTimeoutMinutes: 6
refundPolicy:
  nonRefundableHours: 24
releaseRetry:
  unavailableGraceMs: 15000
  defaultMinIntervalMs: 2000
  maxAttempts: 6
courts:
  - name: 1号场深圳
    type: tennis
    uid: 8f2068ee3def11f1ba41b2d27276c64b
  - name: 2号场广州
    type: tennis
    uid: 8f2301003def11f1ba41b2d27276c64b
  - name: 3号场香港
    type: tennis
    uid: 8f23eb623def11f1ba41b2d27276c64b
  - name: 4号场澳门
    type: tennis
    uid: 8f24d5c43def11f1ba41b2d27276c64b
credentialSchema:
  - key: Authorization
    label: 登录令牌
    desc: '从小程序抓包获取(Authorization: Wechat JWT)；有效期约 1 年，ready 检测即验证。'
capture:
  enabled: true
  hosts:
    - wlhmobile.crland.com.cn
  paths:
    - '/business/*'
    - '/order/*'
    - '/member/*'
    - '/marketing/*'
  headers:
    - Authorization
  tasks:
    - id: identity
      label: 身份凭证
      source: credential
      required: true
      maxAgeHours: 8760
