id: funsport
name: 泛思博特壹方城网球中心
desc: 银豹(Pospal)后端, 4 片风雨场
backend:
  base: https://wxservice-stg48.pospal.cn
  storeId: 6019568
  projectUid: '1768357901249380361'
  payMethodBalance: 40
  payMethodWechat: 900
# 放场规则: 2026-09-07 实测日历放场为提前 1 天(用户校准), 原按 2 天推算导致超宽限窗口
advanceDays:
  tennis: 2
release:
  timezone: Asia/Shanghai
  rules:
    tennis:
      mode: calendar-day-batch
      calendarDaysBefore: 1
      at: '00:00:00.000'
bookingHours:
  start: '00:00'
  end: '23:00'
  slotMinutes: 60
  slotEndOffsetMinutes: -1
releaseRetry:
  unavailableGraceMs: 15000
  defaultMinIntervalMs: 3000
  jitterMs: 300
  maxAttempts: 8
  # 首发下单报"未放场"后, 改用 canAppoint 短轮询等待放场(查询接口无风控, 不占下单限流队列)
  watchSlotRelease: true
  watchIntervalMs: 500
  watchJitterMs: 300
  watchTimeoutMs: 180000
courts:
  - name: 1号风雨场
    type: tennis
    uid: '1772457523974619557'
  - name: 2号风雨场
    type: tennis
    uid: '1772457529933371132'
  - name: 3号风雨场
    type: tennis
    uid: '1772457541177684518'
  - name: 4号风雨场
    type: tennis
    uid: '1772457546249418953'
credentialSchema:
  - key: PSPLVISITORID
    label: 访客标识
    desc: 从微信小程序抓包获取；ready 检测即验证其有效性。
capture:
  enabled: true
  hosts:
    - wxservice-stg48.pospal.cn
  matchHeaders:            # 店铺隔离: 同一银豹网关多家店铺, 按请求头 STOREID 区分
    STOREID: '6019568'
  paths:
    - '*'
  headers:
    - PSPLVISITORID
  tasks:
    - id: identity
      label: 身份凭证
      source: credential
      required: true
      maxAgeHours: 24
